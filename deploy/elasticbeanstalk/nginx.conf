worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    log_format healthd '$msec"$uri"$status"$request_time"$upstream_response_time"$http_x_forwarded_for';
    map $time_iso8601 $logdate { "~^(\d{4})-(\d{2})-(\d{2})T(\d{2})" $1-$2-$3-$4; }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map "$server_port:$http_x_forwarded_proto:$http_user_agent" $redirect_https {
        default 1;
        ~^8081: 0;
        ~^8080:https: 0;
        ~*ELB-HealthChecker 0;
    }
    map $server_port $forward_proto { default $http_x_forwarded_proto; 8081 http; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    keepalive_timeout 90;
    client_header_timeout 90;
    client_body_timeout 90;
    gzip on;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    access_log /dev/stdout main;
    access_log /var/log/nginx/healthd/application.log.$logdate healthd;
    server {
        # Variable access-log paths require an existing document root, even
        # when every request is proxied rather than served from this directory.
        root /usr/share/nginx/html;
        listen 8080;
        # Only Tor can reach this listener; it is never published on the host.
        listen 8081;
        server_name _;
        if ($redirect_https) { return 301 https://$host$request_uri; }
        add_header Onion-Location http://snsnsnya6h3ot563f3p566wuhfoklkg5f62hokdlaqzcaub3gf4xlxyd.onion$request_uri;
        location / {
            set $web http://web:8080;
            proxy_pass $web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forward_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
